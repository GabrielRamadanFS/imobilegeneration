# Blueprint do Render (plano grátis). Em "Environment" defina APP_PIN e GEMINI_API_KEY (não ficam no repositório).
services:
  - type: web
    name: imobile-sm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
