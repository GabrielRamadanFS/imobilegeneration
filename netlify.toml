[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # sharp tem binários nativos: não pode ser empacotado
  external_node_modules = ["sharp", "@napi-rs/canvas"]
  # fontes, logo e templates (usados pelo gerador local e pelo provedor Gemini) vão junto com as funções
  included_files = ["assets/**", "public/refs/**"]
